# How the ClassPulse server sends email (verification codes, password resets,
# results and reports).
#
# mail.mode=console  Demo mode. Emails are printed in the server window and saved in
#                    the mail-outbox folder. Works without internet. This is the default.
# mail.mode=smtp     Sends real email through an SMTP account (for example Gmail).
mail.mode=console

# ----- Settings for mail.mode=smtp -----
# Gmail: turn on 2-Step Verification, then create an App Password at
# https://myaccount.google.com/apppasswords and use it as the password.
# The password is NOT stored here. The server asks for it when it starts, or reads
# the CLASSPULSE_MAIL_PASSWORD environment variable.
mail.smtp.host=smtp.gmail.com
# 465 with ssl, or 587 with starttls
mail.smtp.port=465
mail.smtp.security=ssl
mail.smtp.username=your-address@gmail.com
mail.from.name=ClassPulse

# Before creating an account, look up the email's domain in DNS and refuse it if the
# domain has no mail server (catches typos like gmial.com). Needs internet; if DNS
# cannot be reached, the account is still allowed and the emailed code does the check.
mail.checkDomain=true

# MySQL connection used by the ClassPulse server.
# Version 2 uses a new database (classpulse_v2), so the old classpulse database is left untouched.
# It is created automatically on the first run.
db.url=jdbc:mysql://localhost:3306/classpulse_v2?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
db.user=root
# The server asks for the password when it starts, so it is not stored in this file.
# Do not add db.password here if you plan to share or submit this folder.
